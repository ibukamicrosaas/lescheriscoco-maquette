<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf8f1"><title>Les Chéris Coco</title></head><body><main id="preview" aria-live="polite" style="font:15px system-ui;color:#304d42;padding:2rem">Chargement de la maquette…</main><noscript>Cette prévisualisation a besoin de JavaScript activé.</noscript><script>async function unpack(name){const b=await fetch(name).then(r=>{if(!r.ok)throw Error('Chargement impossible');return r.text()});const raw=Uint8Array.from(atob(b.trim()),x=>x.charCodeAt(0));return new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}Promise.all([unpack('page-data.txt'),unpack('site-style.txt')]).then(([html,css])=>{html=html.replace('<link rel="stylesheet" href="styles.css">','<style>'+css+'</style>');document.open();document.write(html);document.close()}).catch(()=>{document.querySelector('#preview').textContent='La maquette n’a pas pu se charger. Réessayez dans un navigateur récent.'})</script></body></html>
